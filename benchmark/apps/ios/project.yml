# xcodegen generate   -> GemmaBench.xcodeproj
name: GemmaBench
options:
  bundleIdPrefix: com.mitlab
  deploymentTarget:
    iOS: "18.0"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4          # last tag with swift-tools 6.1 (Xcode 16.4); main needs 6.2
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4          # 0.31.5+ needs swift-tools 6.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.11.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  GemmaBench:
    type: application
    platform: iOS
    sources: [GemmaBench]
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift
        product: MLX
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    entitlements:
      path: GemmaBench/GemmaBench.entitlements
      properties:
        # E4B QAT-4bit is ~6.8 GB on disk; without these iOS kills the app well before that.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    info:
      path: GemmaBench/Info.plist
      properties:
        CFBundleDisplayName: GemmaBench
        APIToken: $(API_TOKEN)                   # from git-ignored Secrets.xcconfig; empty if absent
        UILaunchScreen: {}
        UIFileSharingEnabled: true               # Finder / Files app can pull Documents/{stdbench,measured}
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:                  # dashboard on the Mac over LAN/Tailscale is plain http :3939
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Upload benchmark runs to the agentic-edge dashboard on your Mac.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                     # set yours, or pick it in Signing & Capabilities
