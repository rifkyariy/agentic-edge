<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice agent</title>
<style>
  :root {
    --bg: #fbfaf9; --panel: #ffffff; --line: #e6e2dd; --sub: #f5f3f0;
    --text: #1c1a17; --muted: #6f6a63;
    --user: #eef2f7; --user-line: #cfdbe8;
    --bot: #f1f5f0; --bot-line: #d2e0cf;
    --accent: #2f6f4e; --danger: #a33a30; --warn: #8a6d1f;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --panel: #1f1e23; --line: #322f38; --sub: #26242b;
      --text: #ecebe8; --muted: #9b958d;
      --user: #22283040; --user-line: #3b4a5e;
      --bot: #1f2a2140; --bot-line: #3a5341;
      --accent: #7fc0a0; --danger: #e08379; --warn: #d7b35a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 7px; }
  /* One quiet group instead of four bordered chips. Colour carries the state;
     the label just says which service. */
  .pills {
    display: flex; align-items: center; gap: 14px; margin-left: auto;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px;
    background: var(--bg);
  }
  .svc { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .svc .led {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    box-shadow: 0 0 0 0 transparent; transition: background .2s;
  }
  .svc.ok .led { background: var(--accent); }
  .svc.warn .led { background: var(--warn); animation: breathe 1.4s ease-in-out infinite; }
  .svc.bad .led { background: var(--danger); }
  .svc.ok { color: var(--text); }
  .svc.bad { color: var(--danger); }
  @media (max-width: 760px) { .svc .nm { display: none; } .pills { gap: 9px; } }

  .split { flex: 1; display: flex; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  aside {
    width: 370px; flex: 0 0 370px; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 14px;
  }
  aside h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }

  .step { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; background: var(--bg); }
  .step > summary {
    cursor: pointer; padding: 8px 10px; display: flex; align-items: center; gap: 7px;
    font-size: 13px; list-style: none;
  }
  .step > summary::-webkit-details-marker { display: none; }
  .step .num {
    font-size: 10px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; font-family: var(--mono);
  }
  .step .val { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .step .val.off { color: var(--muted); }
  .step .body { padding: 0 10px 10px; font-size: 12px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-family: var(--mono); font-size: 11px; }
  .kv b { font-weight: 400; color: var(--text); }

  /* Live status per stage, so the pipeline reads as it happens rather than
     only after the turn is over. */
  .pdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--line); }
  .pdot.run { background: var(--accent); animation: breathe 1.2s ease-in-out infinite; }
  .pdot.done { background: var(--accent); }
  .pdot.skip { background: transparent; border: 1px solid var(--line); }
  .pdot.bad { background: var(--danger); }
  .step.run { border-color: var(--accent); }
  .step.run > summary > span:nth-of-type(2) { color: var(--text); }

  /* Classification chips: the whole set is shown, the matched one lit, so a
     misrouted question is obvious. */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .cat {
    font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .cat.on { border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .why {
    margin-top: 7px; padding: 7px 8px; border-left: 2px solid var(--accent);
    background: var(--sub); border-radius: 0 6px 6px 0; color: var(--text);
    font-size: 11.5px;
  }
  .why code {
    font-family: var(--mono); font-size: 11px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
  }
  /* Nested expandable (full JSON, per-tool evidence). */
  details.sub { margin-top: 6px; border: 1px solid var(--line); border-radius: 6px; }
  details.sub > summary {
    cursor: pointer; list-style: none; padding: 5px 8px; font-size: 11px;
    color: var(--muted); display: flex; align-items: center; gap: 5px;
  }
  details.sub > summary::-webkit-details-marker { display: none; }
  details.sub > summary:hover { color: var(--accent); }
  details.sub[open] > summary { border-bottom: 1px solid var(--line); }
  details.sub > .inner { padding: 0 8px 8px; }
  details.sub > .inner > pre { max-height: 420px; }
  .part {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 6px;
    align-items: center; padding: 3px 0; font-size: 11.5px;
  }
  .part + .part { border-top: 1px dashed var(--line); }
  .part .svg-ico { width: 13px; height: 13px; }
  .part b { color: var(--text); font-weight: 400; }
  .part .amt { font-family: var(--mono); font-size: 10.5px; }
  .part.out { opacity: .45; }
  .srcrow {
    display: flex; align-items: center; gap: 5px; padding: 3px 0;
    font-size: 11px; overflow: hidden;
  }
  .srcrow a { color: var(--muted); text-decoration: none; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .srcrow a:hover { color: var(--accent); text-decoration: underline; }
  .srcrow .host { color: var(--text); font-family: var(--mono); font-size: 10.5px; flex: 0 0 auto; }
  .tcall { border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; margin-top: 7px; }
  .tcall.bad { border-color: var(--danger); }
  .tcall .thead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
  .tcall .thead .nm { font-family: var(--mono); }
  .tcall .thead .rt { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .nowline { font-family: var(--mono); font-size: 15px; color: var(--text); }
  pre {
    background: var(--sub); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px; overflow-x: auto; font-family: var(--mono); font-size: 10.5px;
    margin: 6px 0 0; max-height: 210px; color: var(--text);
  }
  .note { color: var(--warn); }

  .turn {
    max-width: 78%; padding: 9px 13px; border-radius: var(--radius);
    border: 1px solid; flex: 0 0 auto;   /* never squashed by later messages */
  }
  .turn.user { align-self: flex-end; background: var(--user); border-color: var(--user-line); }
  .turn.bot { align-self: flex-start; background: var(--bot); border-color: var(--bot-line); }
  .turn .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
  /* Replay control lives inside the reply it belongs to, not in its own bubble. */
  .say {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 7px;
    font: inherit; font-size: 11.5px; cursor: pointer; color: var(--muted);
    background: transparent; border: 1px solid var(--bot-line);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s;
  }
  .say:hover { color: var(--accent); border-color: var(--accent); }
  .say.on { color: var(--accent); border-color: var(--accent); }
  .say .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  .say .eq i {
    width: 2px; background: currentColor; border-radius: 1px; height: 4px;
    animation: eq .9s ease-in-out infinite;
  }
  .say .eq i:nth-child(2) { animation-delay: .15s; }
  .say .eq i:nth-child(3) { animation-delay: .3s; }
  .say .eq i:nth-child(4) { animation-delay: .45s; }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 11px; } }

  /* Source chips sit beside the replay control, on the reply they belong to. */
  .srcs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    color: var(--muted); text-decoration: none; background: transparent;
    border: 1px solid var(--bot-line); border-radius: 999px; padding: 3px 9px;
    max-width: 190px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .chip.warnchip { color: var(--warn); border-color: var(--warn); cursor: help; }
  .chip.srcbtn { cursor: pointer; }
  .chip.srcbtn.open { color: var(--accent); border-color: var(--accent); }
  .srclist {
    margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--bot-line);
    display: flex; flex-direction: column; gap: 5px;
  }
  .srclist[hidden] { display: none; }
  .srcitem {
    display: flex; flex-direction: column; text-decoration: none;
    color: var(--text); font-size: 12px; line-height: 1.35;
  }
  .srcitem:hover .st { color: var(--accent); text-decoration: underline; }
  .srcitem .sh { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
  .foot { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 7px; }
  .foot .say { margin-top: 0; }

  /* Pages being flipped through, while the agent searches. */
  .deck { position: relative; width: 46px; height: 26px; flex: 0 0 auto; }
  .deck i {
    position: absolute; inset: 0 auto 0 0; width: 20px; height: 26px;
    border: 1px solid var(--accent); border-radius: 3px;
    background: var(--panel); opacity: .9;
    animation: deal 2.1s cubic-bezier(.45,0,.35,1) infinite;
  }
  .deck i:nth-child(2) { animation-delay: .7s; }
  .deck i:nth-child(3) { animation-delay: 1.4s; }
  @keyframes deal {
    0%   { transform: translateX(0) rotate(0deg);      opacity: .25; }
    25%  { transform: translateX(13px) rotate(7deg);   opacity: 1; }
    60%  { transform: translateX(26px) rotate(-5deg);  opacity: 1; }
    100% { transform: translateX(26px) rotate(-5deg);  opacity: 0; }
  }
  .searching { display: flex; align-items: center; gap: 10px; }
  .searching .what { font-size: 13px; color: var(--muted); }
  /* Clauses are speech flush points, not line breaks. Render them as flowing
     prose or the reply reads as a broken list at every comma. The joining space
     is added in JS: a CSS content:' ' gets collapsed at an inline boundary. */
  .clause { display: inline; }
  .turn .body { overflow-wrap: break-word; }
  .meta { align-self: center; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sys { align-self: center; font-size: 12px; color: var(--warn); text-align: center; }
  .empty { color: var(--muted); align-self: center; margin-top: 26px; text-align: center; }

  /* F1 race card. */
  .f1 {
    align-self: flex-start; max-width: 78%; min-width: 310px; flex: 0 0 auto;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
  }
  .f1head {
    display: flex; align-items: center; gap: 10px; padding: 7px 13px;
    border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted);
  }
  .f1head .when { margin-left: auto; font-family: var(--mono); }
  /* Official mark is drawn in solid white — chip it on black like the site
     does, so it stays visible on a light card too. */
  .f1mark {
    display: inline-flex; align-items: center; height: 16px; padding: 0 6px;
    background: #111; border-radius: 3px;
  }
  .f1mark img { height: 8px; display: block; }
  .f1flag {
    width: 16px; height: 11px; object-fit: cover; border-radius: 2px;
    border: 1px solid var(--line); vertical-align: -1px;
  }

  .f1hero {
    display: grid; grid-template-columns: auto 1fr auto; gap: 11px;
    align-items: center; padding: 11px 13px;
  }
  .fphoto {
    width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
    /* Driver cutouts are full-body (440x1265) — top-anchor for the face. */
    object-position: top center; border: 1px solid var(--line);
  }
  .fcirc {
    width: 84px; max-height: 60px; object-fit: contain; opacity: .85;
    /* Many Commons track maps are black line art; lift them in dark mode. */
  }
  @media (prefers-color-scheme: dark) { .fcirc { filter: invert(1) hue-rotate(180deg); opacity: .7; } }
  .fherotext { min-width: 0; }
  .f1name { font-size: 16px; font-weight: 500; line-height: 1.2; }
  .f1loc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .fwin { font-size: 12.5px; margin-top: 5px; }
  .fwin .wlab {
    font-size: 9.5px; letter-spacing: .6px; text-transform: uppercase;
    color: var(--danger); border: 1px solid var(--danger);
    border-radius: 3px; padding: 0 4px; margin-right: 4px;
  }
  .podium, .f1rest { border-top: 1px solid var(--line); }
  .f1rest[hidden] { display: none; }
  .frow {
    display: grid; grid-template-columns: 26px 26px 1fr auto auto; gap: 9px;
    align-items: center; padding: 5px 13px; font-size: 12.5px;
  }
  .favi {
    width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
    object-position: top center; background: var(--sub);
  }
  .frow + .frow { border-top: 1px solid var(--line); }
  .frow .fpos {
    font-family: var(--mono); font-size: 11px; text-align: center;
    color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
  }
  .frow.p1 .fpos { color: #9a7b18; border-color: #c9a227; font-weight: 500; }
  .frow.p2 .fpos { color: var(--muted); border-color: var(--border-strong, #9aa0a6); }
  .frow.p3 .fpos { color: #8a5a2b; border-color: #b87333; }
  .frow.p1 { font-size: 13.5px; }
  .frow .fteam {
    font-size: 11px; color: var(--muted); display: inline-flex;
    align-items: center; gap: 4px;
  }
  .fteamlogo {
    /* Thin white marks (Ferrari's shield, Mercedes' star) read as a smudge
       any smaller than this. Round badge in the team's own livery color;
       #111 only when a team has none on file. */
    height: 22px; width: 22px; object-fit: contain; background: #111;
    border-radius: 50%; padding: 4px; box-sizing: border-box;
  }
  .frow .ftime { font-family: var(--mono); font-size: 11px; }
  .frow .fl {
    font-size: 9px; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 3px; padding: 0 3px; vertical-align: 1px;
  }
  .f1foot {
    display: flex; gap: 10px; align-items: center; padding: 7px 13px;
    border-top: 1px solid var(--line); font-size: 11px; color: var(--muted);
  }
  .f1foot .hl { display: inline-flex; align-items: center; gap: 4px; }
  .f1foot .svg-ico { width: 12px; height: 12px; }
  .f1foot .restbtn {
    margin-left: auto; font: inherit; font-size: 11px; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px;
  }
  .f1foot .restbtn:hover, .f1foot .restbtn.open {
    color: var(--accent); border-color: var(--accent);
  }
  .f1foot a { color: var(--muted); text-decoration: none; }
  .f1foot a:hover { color: var(--accent); text-decoration: underline; }

  /* Weather card, in the style of a phone weather widget: one coloured
     panel, the temperature carrying the layout, hours along the bottom.
     The gradient comes from the condition, so a glance tells you the
     weather before you read anything. */
  .wx {
    align-self: flex-start; max-width: 78%; min-width: 320px; flex: 0 0 auto;
    border-radius: 18px; overflow: hidden; color: #fff;
    padding: 15px 17px 0; position: relative;
    background: linear-gradient(160deg, #2f7fd1 0%, #3f96de 45%, #66b0e8 100%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .13);
  }
  .wx.night {
    background: linear-gradient(160deg, #1f2b52 0%, #2b3e6e 50%, #41598f 100%);
  }
  .wx.wet {
    background: linear-gradient(160deg, #46617e 0%, #5b7d9c 50%, #7f9bb3 100%);
  }
  .wx.storm {
    background: linear-gradient(160deg, #2d3446 0%, #414b63 50%, #5a6580 100%);
  }
  .wxtop { display: flex; align-items: flex-start; gap: 12px; }
  .wxtop .left { min-width: 0; }
  .wxplace {
    font-size: 19px; font-weight: 500; letter-spacing: .1px;
    line-height: 1.15; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wxsub { font-size: 11.5px; opacity: .8; margin-top: 1px; }
  .wxtemp {
    font-size: 56px; font-weight: 200; line-height: 1; margin-top: 4px;
    letter-spacing: -2px;
  }
  .wxright { margin-left: auto; text-align: right; flex: 0 0 auto; }
  .wxright .mark { width: 34px; height: 34px; stroke-width: 1.5; }
  .wxcond { font-size: 15px; font-weight: 500; margin-top: 6px; }
  .wxfeel { font-size: 11.5px; opacity: .85; margin-top: 1px; }

  .wxbits {
    display: flex; gap: 13px; flex-wrap: wrap; font-size: 11px;
    opacity: .9; margin: 10px 0 0;
  }
  .wxbits .b { display: inline-flex; align-items: center; gap: 4px; }
  .wxbits .svg-ico { width: 12px; height: 12px; opacity: .85; }

  /* Hour strip. Hairline above it rather than a filled band, so the card
     stays one surface. */
  .wxhours {
    display: flex; margin: 11px -17px 0; padding: 9px 8px 11px;
    border-top: 1px solid rgba(255, 255, 255, .22); overflow-x: auto;
  }
  .wxh {
    flex: 1 0 auto; min-width: 54px; text-align: center; padding: 0 3px;
    font-size: 11px;
  }
  .wxh .hh { opacity: .8; font-variant-numeric: tabular-nums; }
  .wxh .svg-ico { width: 21px; height: 21px; margin: 6px 0 4px; stroke-width: 1.8; }
  .wxh .ht {
    display: block; font-size: 14.5px; font-weight: 500; letter-spacing: -.2px;
    font-variant-numeric: tabular-nums;
  }
  /* Reserved whether or not there is rain to report, so every column's
     temperature sits on the same baseline. */
  .wxh .hp { display: block; font-size: 9.5px; opacity: .85; min-height: 12px; margin-top: 2px; }
  .wxh.now .hh { font-weight: 600; opacity: 1; }
  .wxh.sun .svg-ico { opacity: .95; }
  /* The sun column has no temperature; make sure its label cannot be read
     as one. */
  .wxh.sun .ht { font-size: 10px; font-weight: 400; opacity: .75; letter-spacing: 0; }
  /* Sun and clear conditions read as warm; everything else stays white so
     the strip does not turn into a colour chart. */
  .wxh .warm, .wxright .warm { color: #ffd76a; }

  .wxfoot {
    display: flex; align-items: center; gap: 8px; margin: 0 -17px;
    padding: 7px 17px 8px; font-size: 10.5px;
    background: rgba(0, 0, 0, .13);
  }
  .wxfoot a { color: #fff; opacity: .8; text-decoration: none; margin-left: auto; }
  .wxfoot a:hover { opacity: 1; text-decoration: underline; }
  .wxfoot .f1flag { border-color: rgba(255, 255, 255, .5); }

  /* Exchange-rate card. */
  .fx {
    align-self: flex-start; max-width: 78%; min-width: 290px; flex: 0 0 auto;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
  }
  .fxhead {
    display: flex; align-items: center; padding: 7px 13px;
    border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted);
  }
  .fxhead .pair { color: var(--text); font-size: 12px; letter-spacing: .3px; }
  .fxhead .per { margin-left: auto; font-family: var(--mono); }
  .fxmain { display: flex; align-items: baseline; gap: 10px; padding: 13px 13px 2px; }
  .fxmain .big { font-size: 27px; font-weight: 500; line-height: 1.1; }
  .fxmain .big .cur { font-size: 14px; color: var(--muted); font-weight: 400; }
  .fxmain .chg { margin-left: auto; font-size: 13px; font-family: var(--mono); }
  .fxmain .chg.up { color: var(--accent); }
  .fxmain .chg.down { color: var(--danger); }
  .fxsub { padding: 0 13px 10px; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .spark { display: block; width: 100%; height: 62px; }
  .spark polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .spark .lu { stroke: var(--accent); }
  .spark .ld { stroke: var(--danger); }
  .spark polygon { stroke: none; }
  .spark .au { fill: var(--accent); opacity: .12; }
  .spark .ad { fill: var(--danger); opacity: .12; }
  .fxfoot {
    display: flex; gap: 10px; align-items: center; padding: 7px 13px;
    border-top: 1px solid var(--line); font-size: 11px; color: var(--muted);
  }
  .fxfoot a { margin-left: auto; color: var(--muted); text-decoration: none; }
  .fxfoot a:hover { color: var(--accent); text-decoration: underline; }
  .fxfoot .hl { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); }
  .fxfoot .svg-ico { width: 12px; height: 12px; }
  .fxfoot .hi { color: var(--accent); }
  .fxfoot .lo { color: var(--danger); }

  /* Match card. Only rows the tool actually returned are rendered — an empty
     goals list means no goals row, never a guessed one. */
  .match {
    align-self: flex-start; max-width: 78%; min-width: 300px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
    /* #log is a flex column: without this the card shrinks as messages are
       added and overflow:hidden clips its lower rows. */
    flex: 0 0 auto;
  }
  .match .mhead {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted);
  }
  .match .mhead img { width: 15px; height: 15px; object-fit: contain; flex: 0 0 auto; }
  .match .mhead .comp { color: var(--text); font-size: 11.5px; }
  .match .mhead .when { margin-left: auto; text-align: right; }
  .stale {
    display: flex; align-items: center; gap: 5px; font-size: 11px;
    color: var(--warn); padding: 6px 12px; border-bottom: 1px solid var(--line);
    background: var(--sub);
  }
  .venue {
    text-align: center; font-size: 11px; color: var(--muted);
    padding: 0 12px 9px; display: flex; align-items: center;
    justify-content: center; gap: 5px;
  }
  /* Cards are secondary: an icon bottom-right that opens an accordion. */
  .mfoot {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-top: 1px solid var(--line); font-size: 11px;
  }
  .mfoot a { color: var(--muted); text-decoration: none; }
  .mfoot a:hover { color: var(--accent); text-decoration: underline; }
  .cardbtn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 11px; cursor: pointer; color: var(--muted);
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px;
  }
  .cardbtn:hover, .cardbtn.open { color: var(--accent); border-color: var(--accent); }
  .cardbtn .yc, .cardbtn .rc { width: 7px; height: 10px; border-radius: 1.5px; }
  .cardbtn .yc { background: #d7b35a; }
  .cardbtn .rc { background: var(--danger); }
  .cardlist { border-top: 1px solid var(--line); padding: 8px 12px;
              display: flex; flex-direction: column; gap: 4px; }
  /* Must beat the display:flex above, or [hidden] does nothing. */
  .cardlist[hidden] { display: none; }
  .match .live { color: var(--danger); display: flex; align-items: center; gap: 4px; }
  .match .live .led {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    animation: breathe 1.3s ease-in-out infinite;
  }
  .score {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 10px; padding: 14px 12px 10px;
  }
  .side { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .side img { width: 38px; height: 38px; object-fit: contain; }
  .side .badge {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); font-size: 13px; color: var(--muted);
  }
  .side .tname { font-size: 12.5px; line-height: 1.25; }
  .goalsnum { font-size: 27px; font-weight: 500; letter-spacing: 1px; white-space: nowrap; }
  .ht, .countdown { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 8px; }
  .countdown.soon { color: var(--accent); }
  .events { border-top: 1px solid var(--line); padding: 8px 12px; display: flex;
            flex-direction: column; gap: 4px; }
  .ev { display: grid; grid-template-columns: 30px 16px 1fr auto; gap: 7px;
        align-items: center; font-size: 12px; }
  .ev .min { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
  .ev .team { font-size: 11px; color: var(--muted); }
  .ev .ball { width: 9px; height: 9px; border-radius: 50%; background: var(--text); justify-self: center; }
  .ev .yc, .ev .rc { width: 8px; height: 11px; border-radius: 1.5px; justify-self: center; }
  .ev .yc { background: #d7b35a; }
  .ev .rc { background: var(--danger); }
  .ev .pen { font-size: 10px; color: var(--muted); }
  .match .msrc { padding: 7px 12px; border-top: 1px solid var(--line); font-size: 11px; }
  .match .msrc a { color: var(--muted); text-decoration: none; }
  .match .msrc a:hover { color: var(--accent); text-decoration: underline; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; }
  form { display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: var(--radius); font: inherit;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); max-width: 260px;
  }
  button {
    display: flex; align-items: center; gap: 6px; font: inherit; cursor: pointer;
    padding: 10px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  header button, header select { padding: 5px 9px; font-size: 13px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button.stop { color: var(--danger); border-color: var(--danger); }
  button.rec { background: var(--danger); border-color: var(--danger); color: var(--bg); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  @keyframes pulse { 50% { opacity: .45; } }
  /* Spinning a brain or an ear looks broken. Only a loader spins; the others
     breathe, and an indeterminate bar carries the sense of ongoing work. */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes slide { 0% { left: -38%; } 100% { left: 100%; } }
  .spin { animation: spin 1.1s linear infinite; }
  .breathe { animation: breathe 1.7s ease-in-out infinite; }

  .turn.busy { border-style: dashed; min-width: 230px; }
  .busy-detail { font-size: 13px; color: var(--muted); }
  .bar {
    position: relative; height: 2px; margin-top: 9px; border-radius: 2px;
    background: var(--bot-line); overflow: hidden;
  }
  .bar::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 38%;
    border-radius: 2px; background: var(--accent);
    animation: slide 1.5s cubic-bezier(.4,0,.6,1) infinite;
  }
  .busy-tail {
    margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--bot-line);
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    color: var(--muted); max-height: 52px; overflow: hidden;
    /* show the newest text, which is at the end */
    display: flex; flex-direction: column-reverse;
  }
  button.rec .svg-ico { animation: pulse 1.1s ease-in-out infinite; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 7px; }

  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  /* Must out-specify .scrim above. The UA stylesheet's [hidden]{display:none}
     is weaker than a class rule, so without this the modal can never hide. */
  .scrim[hidden] { display: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; max-width: 460px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .modal h3 {
    margin: 0 0 12px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 7px;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .swap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .swap .card {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .swap .card.to { border-color: var(--accent); }
  .swap .card .lbl { font-size: 10px; color: var(--muted); text-transform: none; }
  .swap .card .nm { font-size: 13px; }
  .swap .card .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .modal .warn {
    font-size: 12px; color: var(--warn); background: var(--sub);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .svg-ico { width: 16px; height: 16px; flex: 0 0 auto; }
  aside .svg-ico { width: 14px; height: 14px; }
  @media (max-width: 900px) {
    .split { flex-direction: column; }
    aside { width: auto; flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1><i data-lucide="audio-lines" class="svg-ico"></i> Voice agent</h1>
  <select id="modelSel" title="Switch model — restarts va-llm"></select>
  <button type="button" id="sound" title="Mute or unmute the agent's voice">
    <i data-lucide="volume-2" class="svg-ico" id="soundIcon"></i> <span id="soundLabel">Sound on</span>
  </button>
  <div class="pills" id="pills"></div>
</header>

<div class="split">
  <div id="log">
    <div class="empty" id="empty">Nothing yet. Record a turn, or type one below.</div>
  </div>
  <aside>
    <h2><i data-lucide="list-tree" class="svg-ico"></i> Pipeline — last turn</h2>
    <div id="steps"></div>
  </aside>
</div>

<footer>
  <form id="f">
    <button type="button" id="mic" title="Click to record, click again to send">
      <i data-lucide="mic" class="svg-ico" id="micIcon"></i> <span id="micLabel">Record</span>
    </button>
    <input type="text" id="t" placeholder="Type what the user says…" autocomplete="off">
    <button type="submit" class="primary" id="send"><i data-lucide="send" class="svg-ico"></i> Send</button>
    <button type="button" class="stop" id="stop" title="Barge-in: stop speaking now">
      <i data-lucide="octagon-x" class="svg-ico"></i> Stop
    </button>
  </form>
  <div class="hint" id="hint">Connecting…</div>
</footer>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"><i data-lucide="refresh-cw" class="svg-ico"></i> Switch model</h3>
    <div id="mBody"></div>
    <div class="modal-actions">
      <button type="button" id="mCancel">Cancel</button>
      <button type="button" class="primary" id="mOk">
        <i data-lucide="check" class="svg-ico"></i> Switch and restart
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
const log = document.getElementById('log'), hint = document.getElementById('hint');
const empty = document.getElementById('empty'), pills = document.getElementById('pills');
const stepsEl = document.getElementById('steps');
const icons = () => { try { lucide.createIcons(); } catch (e) {} };
icons();

// botTurn is where clauses append; lastBotTurn outlives it, because TTS audio
// for the final clause often lands after the turn is already marked done.
let botTurn = null, lastBotTurn = null, cfg = {}, cur = blank();
function blank() {
  return { clauses: [], clips: [], tools: [], sources: [], match: null,
           t0: null, grounding: null, prompt: null, intent: null,
           request: null, usage: null, done: null, think: 0 };
}
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
// Images go through the Pi: fetching them straight from the browser was flaky,
// and one failure permanently replaced the <img> with a fallback. Module scope,
// because every card type needs it — it lived inside renderMatch and renderF1
// died with "img is not defined", which silently killed the whole event handler.
const img = u => '/img?u=' + encodeURIComponent(u);
const num = (v, u = '') => v == null ? '—' : v + u;

// ---------- spoken text -> readable text ----------
// The reply is written to be *heard*: the system prompt makes the model spell
// numbers out ("two thousand twenty six", "zero point eight", "thirteenth")
// because that is what piper needs — "2026" and "0–2" are read badly. The chat
// bubble was showing that same string verbatim, which is right for the ear and
// wrong for the eye. This converts for display only; what TTS receives is
// never touched.
const N_UNIT = { zero: 0, oh: 0, one: 1, two: 2, three: 3, four: 4, five: 5,
  six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12,
  thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,
  eighteen: 18, nineteen: 19 };
const N_TENS = { twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50,
  sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
const N_SCALE = { hundred: 100, thousand: 1000, million: 1e6, billion: 1e9 };
const N_ORD = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6,
  seventh: 7, eighth: 8, ninth: 9, tenth: 10, eleventh: 11, twelfth: 12,
  thirteenth: 13, fourteenth: 14, fifteenth: 15, sixteenth: 16,
  seventeenth: 17, eighteenth: 18, nineteenth: 19, twentieth: 20,
  thirtieth: 30 };

const ordSuffix = n => (n % 100 >= 11 && n % 100 <= 13)
  ? 'th' : (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
// Group thousands, except in the range that is almost always a year here —
// 2026 must not render as "2,026".
const groupNum = n => (n >= 1000 && !(n >= 1900 && n <= 2100))
  ? n.toLocaleString('en-US') : String(n);

// Nouns that make a bare "one" a quantity rather than an article.
const UNIT_AFTER = /^(hours?|minutes?|seconds?|days?|weeks?|months?|years?|goals?|points?|laps?|races?|matches|games?|percent|degrees?|kilometres?|kilometers?|km|miles?|metres?|meters?|m|seats?|wins?|titles?)$/i;

function numKind(w) {
  const k = w.toLowerCase();
  if (k in N_UNIT) return 'u';
  if (k in N_TENS) return 't';
  if (k in N_SCALE) return 's';
  if (k in N_ORD) return 'o';
  if (k === 'and') return 'a';
  if (k === 'point') return 'p';
  return null;
}
const numVal = x => x.k === 'u' ? N_UNIT[x.s]
  : x.k === 't' ? N_TENS[x.s] : x.k === 'o' ? N_ORD[x.s] : null;

/** A run of number words -> digits, or null to leave the words alone. */
function runToText(words) {
  // "one point eight zero four" -> 1.804: after "point" the digits are read
  // one at a time, so they concatenate rather than add.
  const pi = words.findIndex(x => x.k === 'p');
  if (pi > 0 && pi < words.length - 1) {
    const head = runToText(words.slice(0, pi));
    const digits = words.slice(pi + 1).map(numVal);
    if (head == null || digits.some(v => v == null || v > 9)) return null;
    return head.replace(/,/g, '') + '.' + digits.join('');
  }
  const ws = words.filter(x => x.k === 'u' || x.k === 't' || x.k === 's'
                               || x.k === 'o');
  if (!ws.length) return null;
  // A lone "one"/"oh" is usually the article, not a count: "one of the
  // drivers" must not become "1 of the drivers". A unit right after it means
  // it really is a count ("one hour", "one goal").
  if (ws.length === 1 && (ws[0].s === 'one' || ws[0].s === 'oh')
      && !UNIT_AFTER.test(words.after || '')) return null;

  // "three thirty" is a time, not 33 — nobody says unit-then-tens for a
  // cardinal (that would be "thirty three").
  if (ws.length === 2 && ws[0].k === 'u' && ws[1].k === 't'
      && N_UNIT[ws[0].s] >= 1 && N_UNIT[ws[0].s] <= 12 && N_TENS[ws[1].s] <= 50)
    return N_UNIT[ws[0].s] + ':' + String(N_TENS[ws[1].s]).padStart(2, '0');

  // "ten fifteen PM" is a clock time, not 1,015 — both halves land in the
  // teens (unit+unit), which the generic two-chunk merge below otherwise
  // read as a year-style multiply ("nineteen ninety nine" -> 1999).
  // AM/PM right after the run is what tells the two apart.
  if (ws.length === 2 && /^(am|pm)$/i.test(words.after || '')
      && numVal(ws[0]) >= 1 && numVal(ws[0]) <= 12 && numVal(ws[1]) <= 59)
    return numVal(ws[0]) + ':' + String(numVal(ws[1])).padStart(2, '0');

  const ord = ws[ws.length - 1].k === 'o' ? ws.pop() : null;
  if (!ws.length) {
    if (!ord) return null;
    const n = N_ORD[ord.s];
    return groupNum(n) + ordSuffix(n);
  }

  if (ws.some(x => x.k === 's')) {
    // Scale words present: the ordinary accumulate-and-carry reading.
    let total = 0, cur = 0;
    for (const x of ws) {
      if (x.k === 's') {
        const v = N_SCALE[x.s];
        if (v === 100) cur = (cur || 1) * 100;
        else { total += (cur || 1) * v; cur = 0; }
      } else cur += numVal(x);
    }
    const n = total + cur + (ord ? N_ORD[ord.s] : 0);
    return ord ? groupNum(n) + ordSuffix(n) : groupNum(n);
  }

  // No scale word. Split into chunks so "twenty twenty six" (a year read as
  // two pairs) does not add up to 66.
  const chunks = [];
  let cur = null, last = null;
  for (const x of ws) {
    const v = numVal(x);
    if (cur == null) { cur = v; last = x.k; }
    else if (last === 't' && x.k !== 't' && v < 10) { cur += v; last = x.k; }
    else { chunks.push(cur); cur = v; last = x.k; }
  }
  if (cur != null) chunks.push(cur);

  let n;
  if (chunks.length === 1) n = chunks[0];
  else if (chunks.length === 2 && chunks[0] >= 10 && chunks[0] <= 99
           && chunks[1] >= 0 && chunks[1] <= 99)
    n = chunks[0] * 100 + chunks[1];          // "nineteen ninety nine" -> 1999
  else if (chunks.every(c => c < 10))
    return chunks.join('');                    // read digit by digit
  else return null;                            // unsure: leave the words

  n += ord ? N_ORD[ord.s] : 0;
  return ord ? groupNum(n) + ordSuffix(n) : groupNum(n);
}

/** Spoken-style text -> text meant to be looked at. */
function readable(text) {
  if (!text) return text;
  // Keep separators: odd entries of this split are the words.
  const bits = text.split(/([A-Za-z']+)/).filter(s => s !== '');
  const toks = bits.map(s => ({ w: /^[A-Za-z']+$/.test(s), s }));
  const glue = s => /^[ \t -]+$/.test(s);
  const runnable = t => t.w && numKind(t.s);

  const out = [];
  let i = 0;
  while (i < toks.length) {
    const k = toks[i].w ? numKind(toks[i].s) : null;
    if (!k || k === 'a' || k === 'p') { out.push(toks[i].s); i++; continue; }

    const words = [];
    let j = i, lastWord = i;
    while (j < toks.length) {
      if (toks[j].w) {
        const kk = numKind(toks[j].s);
        if (!kk) break;
        words.push({ k: kk, s: toks[j].s.toLowerCase(), idx: j });
        lastWord = j;
        j++;
      } else if (glue(toks[j].s) && runnable(toks[j + 1] || {})) {
        j++;                       // swallow the space inside the run
      } else break;
    }
    // A run must not end on "and"/"point" — "finished second and Lando" was
    // eating the "and".
    while (words.length && (words[words.length - 1].k === 'a'
                            || words[words.length - 1].k === 'p')) words.pop();
    lastWord = words.length ? words[words.length - 1].idx : i;
    words.after = (toks[lastWord + 2] && toks[lastWord + 2].w)
      ? toks[lastWord + 2].s : '';
    const txt = runToText(words);
    if (txt == null) {
      // Leave it exactly as written, separators and all.
      for (let x = i; x <= lastWord; x++) out.push(toks[x].s);
    } else out.push(txt);
    i = lastWord + 1;
  }
  let s = out.join('');
  // Words the prompt forces for the ear but that read better as symbols.
  s = s.replace(/(\d)\s+percent\b/gi, '$1%')
       .replace(/(\d)\s+degrees\b/gi, '$1°')
       // "two to one" -> "2 to 1": either side of a score is a count, so the
       // lone-"one"-is-an-article rule has to yield here.
       .replace(/(\d+)(\s+(?:to|nil|all)\s+)one\b/gi, '$1$21')
       // "4 goals to one" — the score noun sits between the two numbers.
       .replace(/(\d+)(\s+(?:goals?|points?|nil)\s+(?:to|all)\s+)one\b/gi, '$1$21')
       .replace(/\bto\s+one\s+(goals?|points?)\b/gi, 'to 1 $1')
       .replace(/\bone(\s+(?:to|nil|all)\s+)(\d+)/gi, '1$1$2')
       // The model sometimes runs sentences together with no space after the
       // stop ("out of date.The last confirmed result"). A digit after the
       // dot is a decimal, so only a capital letter counts.
       .replace(/([.!?,;:])(?=[A-Z])/g, '$1 ');
  return s;
}

// ---------- conversation ----------
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 60; }
function add(el) { const w = atBottom(); if (empty) empty.remove(); log.appendChild(el); if (w) log.scrollTop = log.scrollHeight; return el; }

function userTurn(text) {
  const d = document.createElement('div');
  d.className = 'turn user';
  d.innerHTML = '<div class="who"><i data-lucide="user" class="svg-ico"></i>heard</div>';
  const s = document.createElement('div'); s.textContent = text; d.appendChild(s);
  add(d); icons(); botTurn = null;
}
function newBotTurn() {
  const el = document.createElement('div');
  el.className = 'turn bot';
  el.innerHTML = '<div class="who"><i data-lucide="bot" class="svg-ico"></i>agent</div>'
    + '<div class="body"></div>';
  el._clips = [];
  add(el); icons();
  lastBotTurn = el;
  return el;
}

function clause(text) {
  if (!botTurn) {
    botTurn = newBotTurn();
    // Sources were gathered before this bubble existed; put them on now.
    if (cur.sources.length) renderSources(botTurn, cur.sources);
  }
  const w = atBottom();
  const body = botTurn.querySelector('.body');
  // Keep the spoken text and re-render the whole bubble from it. Converting
  // each clause on its own split numbers that straddle a clause boundary —
  // a forced mid-sentence flush turned "…point seven five four" into
  // "23.7 54". The audio still gets the original words, one clause at a time.
  botTurn._spoken = (botTurn._spoken ? botTurn._spoken + ' ' : '') + text;
  body.textContent = readable(botTurn._spoken);
  if (w) log.scrollTop = log.scrollHeight;
}

function footOf(el) {
  let f = el.querySelector('.foot');
  if (!f) {
    f = document.createElement('div');
    f.className = 'foot';
    el.appendChild(f);
  }
  return f;
}
