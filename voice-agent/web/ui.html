/** Exchange-rate card: bold result, real chart from the returned series. */
/** Weather card. Every value is a measurement from the tool payload —
    nothing here is inferred, including the gradient, which is picked from the
    WMO code the forecast returned. */
const WARM_ICONS = new Set(['sun', 'cloud-sun', 'cloud-sun-rain', 'sunrise', 'sunset']);
const NIGHT_ICON = { sun: 'moon', 'cloud-sun': 'cloud-moon', 'cloud-sun-rain': 'cloud-moon-rain' };

/** "14:00" -> "2PM", "18:14" -> "6:14PM". Formatted from the string the tool
    returned, which is already in the place's own timezone — reformatting via
    the browser clock would shift it. */
function wxHour(hhmm) {
  const [h, m] = (hhmm || '').split(':').map(Number);
  if (isNaN(h)) return hhmm || '';
  const ap = h < 12 ? 'AM' : 'PM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + (m ? ':' + String(m).padStart(2, '0') : '') + ap;
}

function renderWeather(w) {
  const deg = v => v == null ? '—' : Math.round(v) + '°';
  const wet = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82];
  const storm = [95, 96, 99];
  const snow = [71, 73, 75, 77, 85, 86];
  const tone = storm.includes(w.code) ? 'storm'
    : (wet.includes(w.code) || snow.includes(w.code)) ? 'wet'
    : w.is_day ? 'day' : 'night';
  const icoFor = (name, day) => (day ? name : (NIGHT_ICON[name] || name));
  const mark = icoFor(w.icon || 'sun', w.is_day);

  // Slot the next sunrise/sunset in among the hours, the way a phone widget
  // does, rather than listing it separately.
  const cols = (w.hours || []).slice(0, 6).map(h => ({
    label: h.hour.slice(0, 2) === (w.observed || '').slice(11, 13)
      ? 'Now' : wxHour(h.hour),
    icon: icoFor(h.icon || 'cloud', w.is_day || h.hour < '18:00'),
    temp: deg(h.temp), pop: h.rain_chance, now: h.hour.slice(0, 2) === (w.observed || '').slice(11, 13),
  }));
  if (w.sun) {
    const col = { label: wxHour(w.sun.hour), icon: w.sun.kind,
                  temp: w.sun.kind === 'sunrise' ? 'rise' : 'set', sunEvent: true };
    // Keep it in time order: after the last hour earlier than the event.
    let idx = (w.hours || []).findIndex(h => h.hour > w.sun.hour);
    if (idx < 0) idx = cols.length;
    cols.splice(Math.min(idx, cols.length), 0, col);
    cols.length = Math.min(cols.length, 7);
  }

  const el = document.createElement('div');
  el.className = 'wx ' + tone;
  el.innerHTML =
    `<div class="wxtop">
       <div class="left">
         <div class="wxplace">${esc(w.place || 'Weather')}</div>
         <div class="wxsub">${esc([w.admin && w.admin !== w.place ? w.admin : '',
             w.country].filter(Boolean).join(' · '))}</div>
         <div class="wxtemp">${deg(w.temp)}</div>
       </div>
       <div class="wxright">
         <i data-lucide="${esc(mark)}" class="mark${
            WARM_ICONS.has(mark) ? ' warm' : ''}"></i>
         <div class="wxcond">${esc(w.label || '')}</div>
         <div class="wxfeel">feels like ${deg(w.feels)}</div>
       </div>
     </div>
     <div class="wxbits">
       <span class="b"><i data-lucide="droplets" class="svg-ico"></i>${esc(w.humidity ?? '—')}%</span>
       <span class="b"><i data-lucide="wind" class="svg-ico"></i>${esc(w.wind ?? '—')} ${esc(w.wind_unit || '')}</span>
       ${w.precip != null ? `<span class="b"><i data-lucide="umbrella"
          class="svg-ico"></i>${esc(w.precip)} mm</span>` : ''}
       ${w.sun ? `<span class="b"><i data-lucide="${esc(w.sun.kind)}"
          class="svg-ico"></i>${esc(w.sun.kind === 'sunrise' ? 'sunrise' : 'sunset')}
          ${esc(wxHour(w.sun.hour))}</span>` : ''}
     </div>`
    + (cols.length
      ? `<div class="wxhours">${cols.map(c => `
          <div class="wxh${c.now ? ' now' : ''}${c.sunEvent ? ' sun' : ''}">
            <span class="hh">${esc(c.label)}</span>
            <i data-lucide="${esc(c.icon)}" class="svg-ico${
               WARM_ICONS.has(c.icon) ? ' warm' : ''}"></i>
            <span class="ht">${esc(c.temp)}</span>
            <span class="hp">${c.pop ? esc(c.pop) + '%' : ''}</span>
          </div>`).join('')}</div>`
      : '')
    + `<div class="wxfoot">
         ${w.flag ? `<img class="f1flag" src="${esc(img(w.flag))}" alt=""
              onerror="this.remove()">` : ''}
         <span>${esc((w.observed || '').slice(11, 16))} ${esc(w.timezone || '')}</span>
         <a href="https://open-meteo.com/" target="_blank"
            rel="noopener noreferrer">${esc(w.source || 'open-meteo.com')}</a>
       </div>`;
  add(el); icons();
  botTurn = null;
}

function renderCurrency(ci) {
  const fmt = (x) => x >= 100 ? x.toLocaleString(undefined, { maximumFractionDigits: 2 })
    : x >= 0.01 ? x.toFixed(4) : x.toPrecision(6).replace(/0+$/, '');
  const pts = ci.series || [];
  const up = (ci.change_pct || 0) >= 0;

  let chart = '';
  if (pts.length > 2) {
    const W = 300, H = 62, P = 3;
    const vs = pts.map(p => p.v);
    const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
    const xy = pts.map((p, i) => [
      P + i * (W - 2 * P) / (pts.length - 1),
      H - P - ((p.v - lo) / span) * (H - 2 * P)]);
    const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const area = `${P},${H - P} ${line} ${(W - P).toFixed(1)},${H - P}`;
    chart = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
       role="img" aria-label="rate over ${esc(ci.period || '')}">
       <polygon points="${area}" class="${up ? 'au' : 'ad'}"/>
       <polyline points="${line}" class="${up ? 'lu' : 'ld'}"/></svg>`;
  }

  const el = document.createElement('div');
  el.className = 'fx';
  el.innerHTML =
    `<div class="fxhead"><span class="pair">${esc(ci.from)} → ${esc(ci.to)}</span>
       <span class="per">${esc(ci.period || '')}</span></div>
     <div class="fxmain">
       <div class="big">${fmt(ci.converted)} <span class="cur">${esc(ci.to)}</span></div>
       <div class="chg ${up ? 'up' : 'down'}">${up ? '+' : ''}${ci.change_pct}%</div>
     </div>
     <div class="fxsub">${fmt(ci.amount)} ${esc(ci.from)} ·
       1 ${esc(ci.from)} = ${fmt(ci.rate)} ${esc(ci.to)}</div>`
    + chart
    + `<div class="fxfoot">
         <span class="hl"><i data-lucide="arrow-up" class="svg-ico hi"></i>${fmt(ci.high)}</span>
         <span class="hl"><i data-lucide="arrow-down" class="svg-ico lo"></i>${fmt(ci.low)}</span>
         ${ci.url ? `<a href="${esc(ci.url)}" target="_blank"
              rel="noopener noreferrer">${esc(ci.source || 'source')}</a>` : ''}
       </div>`;
  add(el); icons();
  botTurn = null;
}

/** A football result card, built only from fields the tool actually returned. */
function renderMatch(mm) {
  const initials = n => (n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
  const side = (name, logo) =>
    `<div class="side">` + (logo
      ? `<img src="${esc(img(logo))}" alt=""
           onerror="this.outerHTML='<div class=\\'badge\\'>${esc(initials(name))}</div>'">`
      : `<div class="badge">${esc(initials(name))}</div>`)
    + `<span class="tname">${esc(name || '')}</span></div>`;

  const teamName = s => s === 'home' ? mm.home : mm.away;

  // A fixture has no score, goals or cards yet — a compact "schedule" card
  // instead of the result layout.
  if (mm.upcoming) {
    const when = mm.kickoff
      ? new Date(mm.kickoff * 1000).toLocaleString(undefined,
          { weekday: 'short', day: 'numeric', month: 'short',
            hour: '2-digit', minute: '2-digit' })
      : 'date unconfirmed';
    const el = document.createElement('div');
    el.className = 'match';
    el.innerHTML =
      `<div class="mhead">
         ${mm.comp_logo ? `<img src="${esc(img(mm.comp_logo))}" alt=""
              onerror="this.remove()">` : ''}
         <span class="comp">${esc(mm.tournament || 'Upcoming match')}</span>
         <span class="when">${esc(when)}</span>
       </div>
       <div class="score">${side(mm.home, mm.home_logo)}
         <span class="goalsnum">VS</span>
         ${side(mm.away, mm.away_logo)}</div>`
      + (mm.in_days != null
        ? `<div class="countdown${mm.in_days <= 1 ? ' soon' : ''}">${
             mm.in_days === 0 ? 'today' : mm.in_days === 1 ? 'tomorrow'
             : `in ${mm.in_days} days`}</div>`
        : '')
      + (mm.venue
        ? `<div class="venue"><i data-lucide="map-pin" class="svg-ico"
             style="width:12px;height:12px"></i>${esc(mm.venue)}${mm.city ? ', ' + esc(mm.city) : ''}</div>`
        : '')
      + `<div class="mfoot">
           ${mm.url ? `<a href="${esc(mm.url)}" target="_blank"
                rel="noopener noreferrer">${esc(mm.source || 'source')}</a>` : ''}
         </div>`;
    add(el); icons();
    botTurn = null;
    return;
  }

  // Goals and shootout stay on the face of the card; cards go behind a toggle.
  const rows = [];
  for (const g of mm.goals || []) {
    const pen = g.kind && g.kind !== 'regular' ? `<span class="pen">${esc(g.kind)}</span>` : '';
    rows.push(`<div class="ev"><span class="min">${g.minute ?? ''}'</span>
      <span class="ball"></span><span>${esc(g.player || '')} ${pen}</span>
      <span class="team">${esc(teamName(g.side) || '')}</span></div>`);
  }
  for (const s of mm.shootout || []) {
    rows.push(`<div class="ev"><span class="min">pen</span>
      <span class="ball" style="${s.scored ? '' : 'opacity:.3'}"></span>
      <span>${esc(s.player || '')} <span class="pen">${s.scored ? 'scored' : 'missed'}</span></span>
      <span class="team">${esc(teamName(s.side) || '')}</span></div>`);
  }
  const cardRows = (mm.cards || []).map(c =>
    `<div class="ev"><span class="min">${c.minute != null ? c.minute + "'" : ''}</span>
       <span class="${c.kind === 'red' ? 'rc' : 'yc'}"></span>
       <span>${esc(c.player || 'unknown')}${c.coach ? ' <span class="pen">coach</span>' : ''}
         ${c.reason ? `<span class="pen">${esc(c.reason.toLowerCase())}</span>` : ''}</span>
       <span class="team">${esc(teamName(c.side) || '')}</span></div>`);

  const yellows = (mm.cards || []).filter(c => c.kind !== 'red').length;
  const reds = (mm.cards || []).filter(c => c.kind === 'red').length;
  const when = mm.kickoff
    ? new Date(mm.kickoff * 1000).toLocaleString(undefined,
        { day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit' })
    : '';

  const el = document.createElement('div');
  el.className = 'match';
  el.innerHTML =
    `<div class="mhead">
       ${mm.comp_logo ? `<img src="${esc(img(mm.comp_logo))}" alt=""
            onerror="this.remove()">` : ''}
       <span class="comp">${esc(mm.tournament || 'Match')}</span>
       ${mm.round ? `<span>· round ${mm.round}</span>` : ''}
       ${mm.finished === false && mm.status
          ? `<span class="live"><span class="led"></span>${esc(mm.status)}</span>`
          : `<span>· ${esc(mm.status || '')}</span>`}
       ${when ? `<span class="when">${esc(when)}${mm.days_ago != null
            ? ` · ${mm.days_ago === 0 ? 'today' : mm.days_ago + 'd ago'}` : ''}</span>` : ''}
     </div>`
    + (mm.maybe_not_latest
      // Search will not reliably surface a club's newest fixture, so say so
      // rather than letting an older match pass as "the latest".
      ? `<div class="stale"><i data-lucide="triangle-alert" class="svg-ico"
           style="width:12px;height:12px"></i>most recent match that could be
           verified — a newer one may exist</div>`
      : '')
    + `<div class="score">${side(mm.home, mm.home_logo)}
       <span class="goalsnum">${mm.home_score} – ${mm.away_score}</span>
       ${side(mm.away, mm.away_logo)}</div>`
    + (mm.half_time ? `<div class="ht">half time ${mm.half_time[0]} – ${mm.half_time[1]}</div>` : '')
    + (mm.venue
      ? `<div class="venue"><i data-lucide="map-pin" class="svg-ico"
           style="width:12px;height:12px"></i>${esc(mm.venue)}${mm.city ? ', ' + esc(mm.city) : ''}</div>`
      : '')
    + (rows.length ? `<div class="events">${rows.join('')}</div>` : '')
    + (cardRows.length ? `<div class="cardlist" hidden>${cardRows.join('')}</div>` : '')
    + `<div class="mfoot">
         ${mm.url ? `<a href="${esc(mm.url)}" target="_blank"
              rel="noopener noreferrer">${esc(mm.source || 'source')}</a>` : ''}
         ${cardRows.length ? `<button type="button" class="cardbtn">
              ${yellows ? `<span class="yc"></span>${yellows}` : ''}
              ${reds ? `<span class="rc"></span>${reds}` : ''}</button>` : ''}
       </div>`;

  const btn = el.querySelector('.cardbtn');
  if (btn) {
    const list = el.querySelector('.cardlist');
    btn.title = 'Show bookings';
    btn.addEventListener('click', () => {
      list.hidden = !list.hidden;
      btn.classList.toggle('open', !list.hidden);
    });
  }
  add(el); icons();
  botTurn = null;   // the spoken reply gets its own bubble under the card
}

/** A "N sources" label beside replay, expanding to the pages that were read. */
function renderSources(el, items) {
  if (!el || !items || !items.length) return;
  const seen = new Map((el._sources || []).map(s => [s.url, s]));
  for (const it of items) {
    const o = typeof it === 'string' ? { url: it, title: '' } : it;
    if (o.url && !seen.has(o.url)) seen.set(o.url, o);
  }
  el._sources = [...seen.values()];

  const foot = footOf(el);
  let btn = foot.querySelector('.srcbtn');
  if (!btn) {
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip srcbtn';
    btn.addEventListener('click', () => {
      const list = el.querySelector('.srclist');
      if (list) list.hidden = !list.hidden;
      btn.classList.toggle('open', list && !list.hidden);
    });
    foot.appendChild(btn);
  }
  const n = el._sources.length;
  btn.innerHTML = `<i data-lucide="link" class="svg-ico" style="width:12px;height:12px"></i>`
    + `${n} source${n > 1 ? 's' : ''}`;
  btn.title = 'Show the pages this answer came from';

  let list = el.querySelector('.srclist');
  if (!list) {
    list = document.createElement('div');
    list.className = 'srclist';
    list.hidden = true;
    el.appendChild(list);
  }
  list.innerHTML = el._sources.map(s => {
    let host = s.url;
    try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch {}
    return `<a class="srcitem" href="${esc(s.url)}" target="_blank"
              rel="noopener noreferrer"><span class="st">${esc(s.title || host)}</span>
              <span class="sh">${esc(host)}</span></a>`;
  }).join('');
  icons();
}

/** The speaker control for one reply: replays that reply's clips on click. */
function refreshSay(el) {
  if (!el || !el._clips.length) return;
  let btn = el.querySelector('.say');
  if (!btn) {
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'say';
    btn.addEventListener('click', () => {
      if (playingTurn === el && playing) { stopAudio(); return; }
      stopAudio();
      playTurn(el);
    });
    footOf(el).prepend(btn);
  }
  const live = playingTurn === el && playing;
  const secs = el._clips.reduce((a, c) => a + (c.seconds || 0), 0);
  btn.classList.toggle('on', live);
  btn.title = live ? 'Stop' : 'Replay this reply';
  btn.innerHTML = live
    ? '<span class="eq"><i></i><i></i><i></i><i></i></span> speaking'
    : `<i data-lucide="volume-2" class="svg-ico" style="width:13px;height:13px"></i> replay${secs ? ' · ' + secs.toFixed(1) + 's' : ''}`;
  icons();
}
function refreshAllSay() {
  document.querySelectorAll('.turn.bot:not(.busy)').forEach(refreshSay);
}
function meta(text, ico) {
  const d = document.createElement('div'); d.className = 'meta';
  d.innerHTML = `<i data-lucide="${ico}" class="svg-ico"></i>`;
  const s = document.createElement('span'); s.textContent = text; d.appendChild(s);
  add(d); icons();
}
function sys(text) {
  const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; add(d);
}

// A live agent balloon saying what the pipeline is doing right now. Reasoning
// can run for a minute with nothing spoken, and silence must never look like a
// hang. Reuses one element so it updates in place rather than piling up.
let busyEl = null;
const PHASES = {
  transcribing: ['ear', 'listening', 'turning your audio into text'],
  loading:      ['loader', 'loading the model', 'weights are being read from disk'],
  sent:         ['loader', 'thinking', 'prompt sent, waiting for the first token'],
  reasoning:    ['brain', 'reasoning', 'working it out privately — this is not spoken'],
  writing:      ['pencil', 'composing the reply', 'clauses are flushed to speech as they finish'],
  tool:         ['globe', 'searching the web', 'its training data has a cutoff, so it is looking this up'],
  reading:      ['book-open', 'reading a page', 'pulling the text out of one result'],
  // The fetch itself takes about a second; reading the results back is the long
  // part, so the deck stays up for it rather than flashing past.
  digesting:    ['book-open', 'reading the results', 'working through what it found'],
};

function showBusy(phase, detail, tail) {
  const [ico, title, blurb] = PHASES[phase] || ['loader', phase, ''];
  if (!busyEl) {
    busyEl = document.createElement('div');
    busyEl.className = 'turn bot busy';
    add(busyEl);
  }
  const anim = ico === 'loader' ? 'spin' : 'breathe';
  const searchy = phase === 'tool' || phase === 'reading' || phase === 'digesting';
  busyEl.innerHTML =
    `<div class="who"><i data-lucide="${ico}" class="svg-ico ${anim}"></i>agent · ${title}</div>`
    + (searchy
      // Pages being flipped through, rather than a spinner.
      ? `<div class="searching"><span class="deck"><i></i><i></i><i></i></span>
           <span class="what">${esc(detail || blurb)}</span></div>`
      : `<div class="busy-detail">${esc(detail || blurb)}</div>`)
    + (tail ? `<div class="busy-tail"><div>${esc(tail)}</div></div>` : '')
    + '<div class="bar"></div>';
  icons();
  if (atBottom()) log.scrollTop = log.scrollHeight;
}
function clearBusy() { if (busyEl) { busyEl.remove(); busyEl = null; } }

// ---------- inspector ----------
// Which sections the reader opened. renderSteps() rewrites the whole panel on
// every event, which would otherwise snap every section shut mid-turn — the
// one thing that makes a live view unusable.
const openKeys = new Set();
let openWired = false;
function wireOpen() {
  if (openWired) return;
  openWired = true;
  // "toggle" does not bubble; capture on the container catches it anyway.
  stepsEl.addEventListener('toggle', e => {
    const k = e.target.dataset?.k;
    if (!k) return;
    if (e.target.open) openKeys.add(k); else openKeys.delete(k);
  }, true);
}

/** status: 'wait' | 'run' | 'done' | 'skip' | 'bad' */
function step(n, key, ico, title, value, status, bodyHtml) {
  const open = openKeys.has(key);
  return `<details class="step ${status === 'run' ? 'run' : ''}"
      data-k="${key}"${open ? ' open' : ''}>
    <summary><span class="num">${n}</span><span class="pdot ${status}"></span>
      <i data-lucide="${ico}" class="svg-ico"></i>
      <span>${title}</span>
      <span class="val${status === 'done' || status === 'run' ? '' : ' off'}">${value}</span></summary>
    <div class="body">${bodyHtml}</div></details>`;
}

/** A nested expandable block whose open state also survives re-render. */
function sub(key, label, bodyHtml) {
  return `<details class="sub" data-k="${key}"${openKeys.has(key) ? ' open' : ''}>
    <summary><i data-lucide="chevron-right" class="svg-ico"
      style="width:12px;height:12px"></i>${esc(label)}</summary>
    <div class="inner">${bodyHtml}</div></details>`;
}

const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };

function srcList(items) {
  return items.map(it => {
    const u = typeof it === 'string' ? it : it.url;
    const t = (typeof it === 'string' ? '' : it.title) || '';
    return `<div class="srcrow"><i data-lucide="link" class="svg-ico"
        style="width:11px;height:11px;flex:0 0 auto"></i>
      <span class="host">${esc(host(u))}</span>
      <a href="${esc(u)}" target="_blank" rel="noopener noreferrer"
         title="${esc(u)}">${esc(t || u)}</a></div>`;
  }).join('');
}
function toggle(key, value, options) {
  return '<div style="margin-top:7px;display:flex;gap:5px;align-items:center">'
    + options.map(o =>
        `<button type="button" class="opt${o === value ? ' primary' : ''}"
           data-key="${key}" data-value="${o}"
           style="padding:3px 9px;font-size:12px">${o}</button>`).join('')
    + '<span style="font-size:11px;color:var(--muted)">restarts va-llm</span></div>';
}

function kv(pairs) {
  return '<div class="kv">' + pairs.filter(p => p)
    .map(([k, v]) => `<span>${k}</span><b>${esc(v)}</b>`).join('') + '</div>';
}

function renderSteps() {
  const i = cur.input || {}, u = cur.usage || {}, d = cur.done || {}, r = cur.request || {};
  const m = cfg.model || {};
  const g = cur.grounding || {}, p = cur.prompt || {}, cl = cur.intent || {};
  const audioTotal = cur.clips.reduce((a, c) => a + (c.seconds || 0), 0);
  const tps = (u.completion_tokens && d.total) ? (u.completion_tokens / d.total).toFixed(1) : null;
  // A turn is live from the moment it is heard until "done"/"empty" lands.
  const live = !!cur.t0 && !cur.done;
  const mic = i.source === 'microphone';

  stepsEl.innerHTML = [
    step(1, 'in', 'file-audio', 'Audio in',
      mic ? num(i.audio_s, 's') : (i.source ? 'typed' : '—'),
      i.source ? 'done' : (live ? 'run' : 'wait'),
      mic
        ? kv([['source', 'browser mic'], ['container', i.mime],
              ['upload', (i.bytes / 1024).toFixed(0) + ' KiB'],
              ['duration', num(i.audio_s, ' s')],
              ['ffmpeg → 16k mono', num(i.decode_s, ' s')]])
          + (i.url
            ? `<div style="margin-top:7px;color:var(--text)">Replay exactly what
                 whisper heard:</div>
               <audio controls preload="none" src="${i.url}"
                 style="width:100%;height:30px;margin-top:3px"></audio>`
            : '<div class="note" style="margin-top:6px">Not retained — set VA_TTS_AUDIO_OUT to spool: to keep input clips.</div>')
        : (i.text
          ? kv([['source', 'typed in the browser'], ['characters', i.text.length]])
            + `<div style="margin-top:7px;color:var(--text)">What was sent:</div>
               <pre>${esc(i.text)}</pre>`
            + '<div class="note" style="margin-top:6px">No audio stage for typed turns — it goes straight onto the utterance bus.</div>'
          : '<div class="note">Waiting for input. Speak into the browser mic or type below; the Pi itself has no capture device.</div>')),

    step(2, 'asr', 'ear', 'Transcription', mic ? num(i.asr_s, 's') : (i.source ? 'skipped' : '—'),
      mic ? (i.text ? 'done' : 'run') : (i.source ? 'skip' : 'wait'),
      mic
        ? `<div style="color:var(--text)">Heard:</div>
           <pre style="font-size:12px">${esc(i.text || '(nothing recognised)')}</pre>`
          + kv([['engine', i.asr_engine], ['model', i.asr_model],
                ['threads', i.asr_threads], ['wall time', num(i.asr_s, ' s')],
                ['realtime factor', num(i.asr_rtf)],
                ['characters', i.text ? i.text.length : 0]])
          + '<div class="note" style="margin-top:6px">Chunked, not streaming: the clip is transcribed once the recording stops.</div>'
        : '<div class="note">Nothing to transcribe — this turn was typed.</div>'),

    step(3, 'now', 'calendar-clock', 'Date & time context', g.date || '—', g.date ? 'done' : (live ? 'run' : 'wait'),
      (g.today
        ? `<div class="nowline">${esc(g.today)}</div>
           <div style="margin-top:2px">${esc(g.clock || '')} ${esc(g.tz || '')}</div>`
        : '<div class="note">Not set yet for this turn.</div>')
      + kv([['told to the model', g.grounded === false ? 'no (no tools offered)' : 'yes'],
            ['ISO date', g.date], ['clock', g.clock], ['timezone', g.tz]])
      + `<div class="why">“Latest”, “today” and “this week” are resolved against
           <b>${esc(g.date || 'the clock on the Pi')}</b>, not against the
           model's training cutoff. Without this line the model treats any
           current date as the future and refuses to look it up — it answered
           <code>I cannot search for events in 2026</code> before it was
           added.</div>`),

    step(4, 'intent', 'git-branch', 'Intent classification',
      cl.kind ? (cl.category_label ? cl.category : cl.kind) : '—',
      cl.kind ? 'done' : (live ? 'run' : 'wait'),
      (cl.kind
        ? `<div style="color:var(--text);font-size:13px">${esc(cl.category_label || '')}</div>`
          + `<div class="why">Routed as <b>${esc(cl.kind)}</b>`
            + (cl.evidence ? ` because the question contains <code>${esc(cl.evidence)}</code>` : '')
            + (cl.kind === 'live'
              ? '. Answering from memory is not allowed here, so a tool call is required.'
              : cl.kind === 'creative'
                ? '. Nothing to look up, so no tools are offered at all — which also keeps the schemas out of the prefill.'
                : '. Nothing forced the issue; the model may look something up or answer directly.')
            + '</div>'
          + '<div class="chips">'
            + [['race_result', 'F1 race result'], ['race_next', 'next F1 race'],
               ['fixture', 'upcoming fixture'], ['match_result', 'football score'],
               ['currency', 'currency'], ['market', 'market'],
               ['weather', 'weather'], ['news', 'breaking news'],
               ['recency', 'changes over time'], ['live_other', 'other live data'],
               ['creative', 'make something'], ['knowledge', 'known knowledge']]
              .map(([k, lbl]) => `<span class="cat${cl.category === k ? ' on' : ''}">${lbl}</span>`).join('')
            + '</div>'
          + kv([['decision', cl.kind], ['category', cl.category],
                ['matched on', cl.evidence || '—'],
                ['tools offered', (cl.offered && cl.offered.length)
                  ? cl.offered.join(', ') : 'none'],
                ['tool call required', cl.forced ? 'yes' : 'no'],
                ['pinned to', cl.pinned || '—']])
        : '<div class="note">Not classified yet.</div>')
      + `<div class="note" style="margin-top:6px">The classifier is a keyword
           rule, not a second model call — an extra LLM round costs 20–40s on
           this board. The full category list is shown so a misroute is visible
           instead of silent.</div>`
      + (cl.pinned
        ? `<div class="note" style="margin-top:6px">tool_choice is pinned to
             <b>${esc(cl.pinned)}</b> and it is the only schema on offer:
             llama.cpp honours a named tool_choice reliably only when it is the
             sole tool, otherwise it has been seen call web_search anyway.</div>`
        : '')),

    step(5, 'prompt', 'file-text', 'Prompt assembly',
      p.parts ? (r.body?.messages || []).length + ' msgs' : '—',
      p.parts ? 'done' : (live ? 'run' : 'wait'),
      (p.parts
        ? p.parts.map(x => {
            const ico = { system: 'shield', history: 'history',
                          user: 'user', tools: 'wrench' }[x.role] || 'dot';
            const amt = x.role === 'tools' ? `${x.count} schemas`
              : x.role === 'history' ? `${x.msgs}/${x.of * 2} msgs · ${x.chars} chars`
              : `${x.chars} chars`;
            return `<div class="part${x.kept ? '' : ' out'}">
                <i data-lucide="${x.kept ? ico : 'minus'}" class="svg-ico"></i>
                <span><b>${esc(x.label)}</b>${x.text
                  ? ` — ${esc(x.text.slice(0, 80))}${x.text.length > 80 ? '…' : ''}` : ''}</span>
                <span class="amt">${x.kept ? amt : 'not included'}</span></div>`;
          }).join('')
          + kv([['total prefill', p.total_chars ? p.total_chars + ' chars' : '—'],
                ['history window', (cfg.history_turns || '?') + ' turns'],
                ['clause flush at', (cfg.flush_chars || '?') + ' chars']])
        : '<div class="note">Not assembled yet.</div>')
      + '<div class="note" style="margin-top:6px">The system prompt is what creates clause boundaries, so TTS has something to flush early. Without it the model emits one long comma-free sentence.</div>'),

    step(6, 'json', 'braces', 'JSON sent to the LLM', r.bytes ? r.bytes + ' B' : '—',
      r.bytes ? 'done' : (live ? 'run' : 'wait'),
      kv([['endpoint', r.url], ['temperature', r.body?.temperature],
          ['max_tokens', r.body?.max_tokens], ['stream', String(!!r.body?.stream)],
          ['repeat_penalty', r.body?.repeat_penalty],
          ['presence_penalty', r.body?.presence_penalty],
          ['tool_choice', typeof r.body?.tool_choice === 'object'
            ? (r.body.tool_choice.function?.name || 'function')
            : (r.body?.tool_choice || 'none')],
          ['messages', (r.body?.messages || []).length],
          ['tools', (r.body?.tools || []).length]])
      + (r.body
        ? (r.body.messages || []).map((msg, n) =>
            sub(`msg${n}`, `${n + 1}. ${msg.role}${msg.name ? ' · ' + msg.name : ''} — ${
              (msg.content || (msg.tool_calls ? '[tool call]' : '')).length} chars`,
              `<pre>${esc(msg.content || JSON.stringify(msg.tool_calls, null, 1))}</pre>`)).join('')
          + sub('rawjson', `full request body (${r.bytes} B)`,
                `<pre>${esc(JSON.stringify(r.body, null, 1))}</pre>`)
        : '<div class="note">Nothing sent yet.</div>')),

    step(7, 'model', 'cpu', 'Model', m.family || '—', m.family ? 'done' : 'wait',
      kv([['file', m.name], ['family', m.family], ['quantisation', m.quant || 'n/a'],
          ['QAT', m.qat ? 'yes' : 'no'], ['size', m.gib ? m.gib + ' GiB' : '—'],
          ['context', cfg.props?.n_ctx || cfg.llm_ctx], ['threads', cfg.llm_threads]])),

    step(8, 'tools', 'globe', 'Tools & evidence',
      cur.tools.length
        ? `${cur.tools.length} call${cur.tools.length > 1 ? 's' : ''}`
        : (cl.kind === 'creative' ? 'none offered'
           : cl.kind ? (cur.done ? 'none used' : 'standing by') : '—'),
      cur.tools.length
        ? (cur.tools.some(t => t.pending) ? 'run'
           : cur.tools.some(t => t.ok === false) ? 'bad' : 'done')
        : (cl.kind === 'creative' ? 'skip' : (live ? 'wait' : 'skip')),
      (cur.tools.length
        ? cur.tools.map((t, n) => {
            const a = t.arguments || {};
            const args = Object.entries(a).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join('  ');
            const items = t.meta?.items
              || (t.meta?.urls || []).map(x => ({ url: x, title: '' }))
              || [];
            const srcs = items.length ? items
              : (t.meta?.url ? [{ url: t.meta.url, title: t.meta.source || '' }] : []);
            return `<div class="tcall${t.ok === false ? ' bad' : ''}">
              <div class="thead">
                <span class="pdot ${t.pending ? 'run' : t.ok ? 'done' : 'bad'}"></span>
                <span class="nm">${esc(t.name)}</span>
                <span class="rt">${t.pending ? 'running…'
                  : `${t.ok ? 'ok' : 'FAILED'} · ${t.took}s · ${t.chars} chars`}</span>
              </div>
              ${args ? `<div style="margin-top:4px;font-family:var(--mono);font-size:10.5px">${esc(args)}</div>` : ''}
              ${t.meta?.results != null ? `<div style="margin-top:3px">${t.meta.results} result${t.meta.results === 1 ? '' : 's'}${t.meta.truncated ? ' · truncated' : ''}</div>` : ''}
              ${srcs.length ? `<div style="margin-top:5px;color:var(--text)">Sources read:</div>${srcList(srcs)}` : ''}
              ${t.content
                ? sub(`ev${n}`, `evidence the model read back (${t.chars} chars${t.content_truncated ? ', showing first ' + t.content.length : ''})`,
                      `<pre>${esc(t.content)}</pre>`)
                : ''}
            </div>`;
          }).join('')
        : `<div>${cl.kind === 'creative'
            ? 'No tools were offered for this turn.'
            : cl.kind === 'live'
              ? 'A lookup is required — waiting for the model to pick a tool.'
              : 'Nothing looked up. The answer comes from the model’s own weights, so it is only as current as its training data.'}</div>`)
      + `<div class="note" style="margin-top:7px">Backend: ${esc(cfg.search_backend || '?')}, no API key and no headless browser — Chromium would starve the LLM on four cores. Capped at ${esc(cfg.search_results || '?')} hits and ${esc(cfg.fetch_chars || '?')} chars a page, because everything fetched becomes prefill the model must read back.</div>`
      + '<div class="note" style="margin-top:6px">Fetched text is wrapped as untrusted data, and fetch_page refuses private and loopback addresses.</div>'),

    step(9, 'mtp', 'zap', 'Speculative decoding (MTP)', cfg.mtp || 'off',
      cfg.mtp === 'on' ? 'done' : 'skip',
      '<div>MTP drafts several tokens, then verifies them in one forward pass. On a GPU that pass costs about what verifying a single token costs, because the tensor cores were idle anyway — so every accepted draft is free speed. On four already-saturated CPU cores there is no idle width: verifying N tokens costs roughly N times one token, so you pay full price for the drafts plus the drafter itself.</div>'
      + `<div class="note" style="margin-top:6px">${esc(cfg.mtp_note || '')}</div>`
      + toggle('mtp', cfg.mtp, ['off', 'on'])),

    step(10, 'think', 'brain', 'Thinking',
      d.think_chars ? d.think_chars + ' chars'
        : (cur.think ? cur.think + ' chars' : (cfg.reasoning || 'off')),
      d.think_chars ? 'done' : (cur.think ? 'run' : (cfg.reasoning === 'on' ? 'wait' : 'skip')),
      '<div>Gemma 4 E-series does emit a reasoning channel through llama.cpp, and it measurably helps accuracy. The cost is that thinking tokens decode at exactly the same rate as speech, so they are pure delay before the first spoken word.</div>'
      + `<div class="note" style="margin-top:6px">${esc(cfg.reasoning_note || '')}</div>`
      + toggle('reasoning', cfg.reasoning, ['off', 'on', 'auto'])),

    step(11, 'gen', 'timer', 'Generation',
      d.first_clause != null ? num(d.total, 's')
        : (cur.clauses.length ? 'writing…' : (live ? 'running…' : '—')),
      d.first_clause != null ? 'done' : (live ? 'run' : 'wait'),
      kv([['first clause', num(d.first_clause, ' s')], ['reply complete', num(d.total, ' s')],
          ['clauses', num(d.clauses ?? (cur.clauses.length || null))],
          ['prompt tokens', num(u.prompt_tokens)], ['output tokens', num(u.completion_tokens)],
          ['decode rate', tps ? tps + ' tok/s' : '—'],
          ['finish reason', d.finish],
          d.interrupted ? ['interrupted', 'yes'] : null,
          d.unverified ? ['cites a source with no search', 'yes'] : null])
      + (cur.clauses.length
        ? '<pre>' + cur.clauses.map((c, n) =>
            `${n + 1}. +${c.at}s  ${esc(readable(c.text))}`).join('\n') + '</pre>'
        : '')),

    step(12, 'tts', 'volume-2', 'Speech synthesis',
      cur.clips.length ? cur.clips.length + ' clips' : (live ? 'waiting…' : '—'),
      cur.clips.length ? (live ? 'run' : 'done') : (live ? 'wait' : 'skip'),
      kv([['voice', cfg.tts_voice], ['sink', cfg.tts_sink],
          ['audio produced', audioTotal ? audioTotal.toFixed(2) + ' s' : '—']])
      + (cur.clauses.length
        ? '<pre>' + cur.clauses.map((c, n) =>
            `${n + 1}. spoken +${c.at}s  ${c.ready != null ? `wav +${c.ready}s` : 'pending'}  ${esc(c.text)}`).join('\n') + '</pre>'
        : '')
      + '<div class="note" style="margin-top:6px">"wav" is when the clip for that clause appeared — the delay you actually hear before speech starts.</div>'
      + '<div class="note" style="margin-top:6px">Shown verbatim as piper received it: numbers stay spelled out, because "2026" and "0–2" are read badly. The chat bubble converts them back to numerals for reading — same words, different rendering.</div>'),

    step(13, 'voice', 'play', 'Generated voice', audioTotal ? audioTotal.toFixed(1) + 's' : '—',
      audioTotal ? 'done' : (live ? 'wait' : 'skip'),
      cur.clips.length
        ? cur.clips.map((c, n) =>
            `<div style="margin-bottom:5px">${n + 1}. ${(c.seconds ?? 0).toFixed(2)}s · ${(c.bytes / 1024).toFixed(0)} KiB
             <audio controls preload="none" src="${c.url}" style="width:100%;height:30px;margin-top:2px"></audio></div>`).join('')
        : '<div class="note">Nothing synthesised yet.</div>'),
  ].join('');
  wireOpen();
  icons();
}

// ---------- playback ----------
const player = new Audio();
player.preload = 'auto';
let audioQueue = [], playing = false, muted = false, unlocked = false;
let playingTurn = null;   // which reply balloon the queue currently belongs to

// Fetch each clip as soon as it is announced. Without this the element stalls
// on the network when its turn comes, which is audible as a gap between clauses.
function enqueue(url, turn) {
  const slot = { url, turn, blobUrl: null };
  // Resolve into the slot rather than awaiting later: play() must not be
  // deferred past the click that triggered it, or autoplay policy blocks it.
  fetch(url).then(r => r.blob())
    .then(b => { slot.blobUrl = URL.createObjectURL(b); })
    .catch(() => {});
  audioQueue.push(slot);
  playNext();
}

/** Replay every clip of one reply, in order. */
function playTurn(el) {
  el._clips.forEach(c => enqueue(c.url, el));
}

function playNext() {
  if (muted || playing) return;
  const slot = audioQueue.shift();
  if (!slot) {
    playingTurn = null;
    refreshAllSay();
    return;
  }
  playing = true;
  playingTurn = slot.turn || playingTurn;
  refreshAllSay();
  // Prefetched blob if it landed, otherwise stream from the URL — either way
  // no await sits between the user's click and play().
  player.src = slot.blobUrl || slot.url;
  player.play().catch(() => {
    playing = false;
    audioQueue.unshift(slot);
    refreshAllSay();
    hint.textContent = 'Click the page once to allow audio playback.';
  });
}
player.addEventListener('ended', () => {
  if (player.src.startsWith('blob:')) URL.revokeObjectURL(player.src);
  playing = false; playNext();
});
player.addEventListener('error', () => { playing = false; playNext(); });

// One-time autoplay unlock. Clicks on an <audio> control are excluded — the
// inspector's own players must not also kick off the queue, which is what made
// clips play twice on top of each other.
document.addEventListener('click', (e) => {
  if (e.target.closest('audio')) return;
  if (unlocked) return;
  unlocked = true;
  if (!playing && audioQueue.length) playNext();
}, { capture: true });

// Pause the queue while an inspector clip is playing, so the two never overlap.
document.addEventListener('play', (e) => {
  if (e.target === player) return;
  if (playing) { player.pause(); playing = false; }
}, { capture: true });
function stopAudio() {
  audioQueue = []; playing = false; playingTurn = null;
  player.pause(); player.removeAttribute('src');
  document.querySelectorAll('audio').forEach(a => { if (a !== player) a.pause(); });
  refreshAllSay();
}
function applyMute(persist) {
  document.getElementById('soundIcon').setAttribute('data-lucide', muted ? 'volume-x' : 'volume-2');
  document.getElementById('soundLabel').textContent = muted ? 'Muted' : 'Sound on';
  if (persist) { try { localStorage.setItem('va-muted', muted ? '1' : '0'); } catch {} }
  icons();
}
document.getElementById('sound').addEventListener('click', () => {
  muted = !muted;
  applyMute(true);
  if (muted) stopAudio(); else playNext();
});
// Per-browser preference, so the mute state survives a reload.
try { muted = localStorage.getItem('va-muted') === '1'; } catch {}
applyMute(false);

// ---------- events ----------
const es = new EventSource('/events');
es.onopen = () => { hint.textContent = 'Idle.'; };
es.onerror = () => { hint.textContent = 'Disconnected — retrying…'; };
es.onmessage = (e) => {
  let m; try { m = JSON.parse(e.data); } catch { return; }
  // A throw inside a card renderer used to abort this handler with no trace —
  // the card just never appeared. Surface it instead of losing it.
  try { handleEvent(m); }
  catch (err) {
    console.error('event handler failed', m.type, err);
    sys(`UI error handling ${m.type}: ${err.message}`);
  }
};

function handleEvent(m) {
  switch (m.type) {
    case 'input':
      if (m.source === 'typed' && cur.input?.source === 'microphone') { cur.input.text = m.text; }
      else { cur = blank(); cur.input = m; }
      renderSteps(); break;
    case 'heard':
      userTurn(m.text); cur.t0 = Date.now();
      showBusy('sent'); break;
    case 'request': cur.request = m; renderSteps(); break;
    case 'usage': cur.usage = m; renderSteps(); break;
    case 'grounding': cur.grounding = m; renderSteps(); break;
    case 'prompt': cur.prompt = m; renderSteps(); break;
    case 'thinking':
      cur.think = m.chars;
      showBusy('reasoning', `${m.chars} characters so far · ${m.at}s elapsed`, m.tail);
      hint.textContent = `Reasoning (${m.chars} chars) — not spoken, but it is working.`;
      break;
    case 'intent':
      cur.intent = { kind: m.intent, forced: m.forced,
                     anyOffered: m.tools_offered, offered: m.offered || [],
                     category: m.category, category_label: m.category_label,
                     evidence: m.evidence, pinned: m.pinned };
      // Say plainly whether this question is being looked up or answered
      // straight from the model, so a wrong classification is visible.
      if (m.intent === 'live')
        sys(`${m.category_label || 'needs live data'} — looking it up`
            + (m.evidence ? ` (matched “${m.evidence}”)` : ''));
      else if (m.intent === 'creative') sys('no lookup needed for this one');
      renderSteps(); break;
    case 'looping':
      sys('cut off a repetition loop — the model started repeating itself');
      break;
    case 'preempted':
      sys(`discarded a guessed answer before the lookup (${m.clauses} clause${m.clauses > 1 ? 's' : ''})`);
      break;
    case 'tool_call': {
      const a = m.arguments || {};
      const q = a.query || a.url
        || (a.from && a.to ? `${a.from} → ${a.to}` : '')
        || Object.values(a).join(' ') || m.name;
      cur.tools.push({ ...m, pending: true });
      showBusy(m.name === 'fetch_page' ? 'reading' : 'tool',
               q ? `“${q}”` : m.name);
      // A tool round means the agent visibly chose to look something up.
      sys(`${m.name === 'fetch_page' ? 'reading'
           : m.name === 'match_result' ? 'checking the score'
           : m.name === 'currency_rate' ? 'checking the rate'
           : m.name === 'f1_result' ? 'checking the race'
           : m.name === 'weather_forecast' ? 'checking the forecast'
           : 'searching'}: ${q || 'latest race'}`);
      renderSteps(); break;
    }
    case 'tool_result': {
      const t = [...cur.tools].reverse().find(x => x.pending && x.name === m.name);
      if (t) Object.assign(t, m, { pending: false });
      // Only collect here. The reply bubble does not exist yet, and lastBotTurn
      // still points at the PREVIOUS reply — attaching now put the sources on
      // the wrong bubble. They go on once this turn's bubble exists.
      cur.sources.push(...(m.meta?.items
        || m.meta?.urls?.map(u => ({ url: u, title: '' }))
        || (m.meta?.url ? [{ url: m.meta.url, title: '' }] : [])));
      if (botTurn) renderSources(botTurn, cur.sources);
      // Structured results get a card. It is drawn from the tool payload only,
      // so nothing on it can be something the model made up.
      if (m.ok && m.meta?.match) { cur.match = m.meta.match; renderMatch(m.meta.match); }
      if (m.ok && m.meta?.currency) renderCurrency(m.meta.currency);
      if (m.ok && m.meta?.f1) renderF1(m.meta.f1);
      if (m.ok && m.meta?.weather) renderWeather(m.meta.weather);
      renderSteps(); break;
    }
    case 'clause':
      clearBusy();
      clause(m.text);
      cur.clauses.push({ text: m.text, at: m.at, ready: null });
      renderSteps(); break;
    case 'audio': {
      const target = botTurn || lastBotTurn || (botTurn = newBotTurn());
      target._clips.push(m);
      enqueue(m.url, target);
      refreshSay(target);
      cur.clips.push(m);
      const pend = cur.clauses.find(c => c.ready == null);
      if (pend && cur.t0) pend.ready = +((Date.now() - cur.t0) / 1000).toFixed(2);
      renderSteps(); break;
    }
    case 'done':
      clearBusy(); cur.done = m;
      renderSources(botTurn || lastBotTurn, cur.sources);
      // The model sometimes says "according to the search results" when nothing
      // was searched. The orchestrator knows better; show the truth.
      if (m.unverified && lastBotTurn) {
        const f = footOf(lastBotTurn);
        if (!f.querySelector('.warnchip')) {
          const w = document.createElement('span');
          w.className = 'chip warnchip';
          w.title = 'This reply cites a source, but no search was run this '
            + 'turn. It came from the model’s training data and may be out of date.';
          w.innerHTML = '<i data-lucide="triangle-alert" class="svg-ico"'
            + ' style="width:12px;height:12px"></i>no search ran';
          f.appendChild(w); icons();
        }
      }
      meta(`first clause ${m.first_clause}s · complete ${m.total}s`
        + (m.think_chars ? ` · ${m.think_chars} chars of reasoning` : '')
        + (m.interrupted ? ' · interrupted' : ''), 'timer');
      botTurn = null; renderSteps(); break;
    case 'empty':
      clearBusy(); cur.done = m;
      sys(`No answer after ${m.total}s — ${m.reason}`);
      botTurn = null; renderSteps(); break;
    case 'state':
      if (m.state === 'digesting')
        showBusy('digesting', cur.sources.length
          ? `${new Set(cur.sources.map(u => { try { return new URL(u).hostname; } catch { return u; } })).size} sources found`
          : undefined);
      else if (m.state === 'thinking') showBusy('sent');
      else if (m.state === 'writing') showBusy('writing');
      else if (m.state === 'transcribing') showBusy('transcribing');
      else if (m.state === 'loading') showBusy('loading');
      else if (m.state === 'idle' && !playing) clearBusy();
      hint.textContent = m.state === 'thinking' ? 'Agent is generating…'
        : m.state === 'writing' ? 'Composing the reply…'
        : m.state === 'transcribing' ? 'Transcribing audio…'
        : m.state === 'loading' ? 'Model is loading — the turn is queued, not lost.'
        : 'Idle.';
      break;
    case 'llm_wait':
      showBusy('loading', `${m.reason} — retry ${m.attempt} of ${m.of}, your turn is queued`);
      hint.textContent = `${m.reason} — waiting (${m.attempt}/${m.of}).`;
      break;
    case 'system': sys(m.text); loadConfig(); break;
    case 'error': meta(m.message, 'triangle-alert'); break;
  }
};

// ---------- controls ----------
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const inp = document.getElementById('t'), text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  try {
    const r = await fetch('/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) meta('could not inject: ' + (await r.text()), 'triangle-alert');
  } catch { meta('network error', 'triangle-alert'); }
});
document.getElementById('stop').addEventListener('click', async () => {
  stopAudio();
  try { await fetch('/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); }
  catch { meta('network error', 'triangle-alert'); }
  botTurn = null;
});

// ---------- microphone ----------
const micBtn = document.getElementById('mic'), micIcon = document.getElementById('micIcon'),
      micLabel = document.getElementById('micLabel');
const canMic = window.isSecureContext && navigator.mediaDevices?.getUserMedia;
let rec = null, chunks = [], stream = null;
function setMic(s) {
  micBtn.classList.toggle('rec', s === 'recording');
  micIcon.setAttribute('data-lucide', s === 'recording' ? 'square' : s === 'busy' ? 'loader' : 'mic');
  micLabel.textContent = s === 'recording' ? 'Stop & send' : s === 'busy' ? 'Transcribing…' : 'Record';
  micBtn.disabled = s === 'busy'; icons();
}
if (!canMic) {
  micBtn.disabled = true;
  micIcon.setAttribute('data-lucide', 'mic-off');
  micLabel.textContent = 'Mic blocked';
  micBtn.title = 'Browser mic needs https or localhost';
  icons();
  sys('Microphone needs https or localhost. Run: ssh -L 8090:localhost:8090 MITLAB-EDGE — then open http://localhost:8090');
} else {
  micBtn.addEventListener('click', async () => {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    } catch { meta('microphone permission denied', 'mic-off'); return; }
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      setMic('busy');
      try {
        const blob = new Blob(chunks, { type: chunks[0]?.type || 'audio/webm' });
        const r = await fetch('/audio', { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) meta(j.error || 'upload failed', 'triangle-alert');
        else if (!j.text) meta('nothing recognised in that clip', 'ear-off');
      } catch { meta('network error sending audio', 'triangle-alert'); }
      setMic('idle');
    };
    rec.start(); setMic('recording');
  });
}

// ---------- model + config ----------
const sel = document.getElementById('modelSel');
let knownModels = { current: '', models: [] };
async function loadModels() {
  try {
    const d = await (await fetch('/models')).json();
    knownModels = d;
    sel.innerHTML = '';
    for (const m of d.models) {
      const o = document.createElement('option');
      o.value = m.path;
      o.textContent = `${m.family}${m.quant ? ' · ' + m.quant : ''}${m.gib ? ' · ' + m.gib + ' GiB' : ''}`;
      if (m.path === d.current) o.selected = true;
      sel.appendChild(o);
    }
    if (!d.models.length) { sel.innerHTML = '<option>no models found</option>'; sel.disabled = true; }
  } catch {}
}
// Measured on this board, so the modal can say what the switch will cost.
const SPEED = {
  'Gemma 4 E2B': '8.2 tok/s decode · 67 tok/s prefill',
  'Gemma 4 E4B': '3.7 tok/s decode · 32 tok/s prefill',
  'Qwen3 4B': '4.7 tok/s decode · 22 tok/s prefill',
};
const scrim = document.getElementById('scrim');
let pendingSwitch = null;

function card(kind, m) {
  if (!m) return `<div class="card"><div class="lbl">${kind}</div><div class="nm">unknown</div></div>`;
  return `<div class="card ${kind === 'to' ? 'to' : ''}">
      <div class="lbl">${kind === 'to' ? 'switching to' : 'currently loaded'}</div>
      <div class="nm">${esc(m.family)}</div>
      <div class="sub">${esc(m.quant || 'n/a')}${m.gib ? ' · ' + m.gib + ' GiB' : ''}</div>
    </div>`;
}

function askSwitch(path, models, currentPath) {
  const to = models.find(m => m.path === path);
  const from = models.find(m => m.path === currentPath);
  pendingSwitch = path;
  document.getElementById('mBody').innerHTML =
    `<div class="swap">${card('from', from)}
       <i data-lucide="arrow-right" class="svg-ico"></i>${card('to', to)}</div>`
    + (to && SPEED[to.family] ? `<div class="sub" style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px">measured here: ${esc(SPEED[to.family])}</div>` : '')
    + `<div class="warn">This restarts <b>va-llm</b>. Loading
       ${to && to.gib ? to.gib + ' GiB' : 'the weights'} off the SD card takes
       roughly ${to && to.gib ? Math.ceil(to.gib * 8) : 30}s, during which the
       model reports <b>loading</b>. Anything you say meanwhile is queued, not
       lost. The choice is remembered for next session.</div>`;
  scrim.hidden = false;
  icons();
  document.getElementById('mOk').focus();
}

function closeModal(revert) {
  scrim.hidden = true;
  pendingSwitch = null;
  if (revert) loadModels();
}

document.getElementById('mCancel').addEventListener('click', () => closeModal(true));
scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal(true); });
document.addEventListener('keydown', (e) => {
  if (scrim.hidden) return;
  // Escape cancels. Enter deliberately does NOT confirm: Enter is the send key,
  // so a stray press would commit a model switch and restart the engine.
  if (e.key === 'Escape') closeModal(true);
});

document.getElementById('mOk').addEventListener('click', async () => {
  const path = pendingSwitch;
  closeModal(false);
  if (!path) return;
  sel.disabled = true;
  showBusy('loading', 'switching model — restarting va-llm');
  try {
    const r = await fetch('/model', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    });
    const j = await r.json();
    if (!j.ok) { meta('model switch failed: ' + j.message, 'triangle-alert'); clearBusy(); }
  } catch { meta('network error', 'triangle-alert'); clearBusy(); }
  setTimeout(() => { sel.disabled = false; loadModels(); loadConfig(); }, 4000);
});

sel.addEventListener('change', () => {
  if (sel.value === knownModels.current) return;
  askSwitch(sel.value, knownModels.models, knownModels.current);
});
async function loadConfig() {
  try { cfg = await (await fetch('/config')).json(); renderSteps(); } catch {}
}

// Option buttons are re-rendered constantly, so delegate rather than re-bind.
stepsEl.addEventListener('click', async (e) => {
  const b = e.target.closest('button.opt');
  if (!b) return;
  const { key, value } = b.dataset;
  if (value === (key === 'mtp' ? cfg.mtp : cfg.reasoning)) return;
  stepsEl.querySelectorAll('button.opt').forEach(x => x.disabled = true);
  try {
    const r = await fetch('/option', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value })
    });
    const j = await r.json();
    if (!j.ok) meta(`${key} -> ${value} failed: ${j.message}`, 'triangle-alert');
  } catch { meta('network error', 'triangle-alert'); }
  setTimeout(() => { loadConfig(); }, 3500);
});

async function poll() {
  try {
    const s = await (await fetch('/status')).json();
    const label = { 'va-asr': 'ears', 'va-llm': 'brain', 'va-tts': 'voice',
                    'va-tools': 'tools', 'va-orchestrator': 'flow' };
    pills.innerHTML = '';
    for (const [unit, state] of Object.entries(s)) {
      const cls = state === 'active' ? 'ok' : state === 'loading' ? 'warn' : 'bad';
      const p = document.createElement('span');
      p.className = 'svc ' + cls;
      p.title = `${unit}: ${state}`;
      p.innerHTML = `<span class="led"></span><span class="nm">${label[unit] || unit}</span>`;
      pills.appendChild(p);
    }
  } catch {}
}
loadModels(); loadConfig(); renderSteps(); poll(); setInterval(poll, 5000);
</script>
</body>
